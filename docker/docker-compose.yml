version: "3.9"

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    entrypoint: ["/usr/local/bin/server"]
    # args: port wait_sec function a b n method
    command: ["9000", "10", "sin", "0", "3.14159265358979", "1000000", "0"]
    ports:
      - "9000:9000"
    networks:
      - integnet

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    entrypoint: ["/usr/local/bin/client"]
    # args: host port threads
    command: ["server", "9000", "4"]
    depends_on:
      - server
    networks:
      - integnet
    deploy:
      replicas: 2

networks:
  integnet:
    driver: bridge
